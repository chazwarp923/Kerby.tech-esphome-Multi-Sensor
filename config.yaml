esphome:
  project:
    name: "Kerby-Tech.Multi-Sensor"
    version: "2.0.1"

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework: 
    type: esp-idf

globals:
  - id: arc_color_good
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(16,185,129)'
  - id: arc_color_okay
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(221,243,0)'
  - id: arc_color_bad
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(255,0,0)'
  - id: arc_color_cold
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(0,192,255)'
  - id: arc_color_error
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(255,255,255)'

logger:

network:
  enable_ipv6: true

switch:
  - platform: restart
    name: "Reboot Sensor"
    icon: mdi:power-cycle

time:
  - platform: sntp
    id: "sntp_time"
    on_time:
      - minutes: /1
        then:
          - lvgl.label.update:
              id: time_value
              text:
                time_format: "%I:%M %p"
      - seconds: 5
        then:
          - lvgl.label.update:
              id: temperature_value
              text: 
                format: "%.0f°F"
                args: [ id(temperature).get_state() * (9.0/5.0) + 32.0 ]
                if_nan: "N/A"
          - lvgl.arc.update:
              id: temperature_arc
              value: !lambda |-
                float temp = id(temperature).get_state();
                return temp * (9.0/5.0) + 32.0;
              indicator:
                arc_color: !lambda |-
                  float temp = id(temperature).get_state() * (9.0/5.0) + 32.0;
                  if      (temp>= 82)              { return id(arc_color_bad); }
                  else if (temp < 82 && temp > 68) { return id(arc_color_good); }
                  else if (temp <= 68)             { return id(arc_color_cold); }
                  else                             { return id(arc_color_error); }
      - seconds: 15
        then:
          - lvgl.label.update:
              id: humidity_value
              text:
                format: "%.0f%%"
                args: [ id(humidity).get_state() ]
                if_nan: "N/A"
          - lvgl.arc.update:
              id: humidity_arc
              value: !lambda return id(humidity).get_state();
              indicator:
                arc_color: !lambda |-
                  int x = id(humidity).state;
                  if (x >= 60)               { return id(arc_color_bad); }
                  else if (x > 50 && x < 60) { return id(arc_color_okay); }
                  else                       { return id(arc_color_good); }
      - seconds: 25
        then:
          - lvgl.label.update:
              id: voc_value
              text:
                format: "%.0f"
                args: [ id(voc).get_state() ]
                if_nan: "N/A"
          - lvgl.arc.update:
              id: voc_arc
              value: !lambda return id(voc).get_state();
              indicator:
                arc_color: !lambda |-
                  int x = id(voc).state;
                  if      (x <= 100)           { return id(arc_color_good); }
                  else if (x > 100 && x < 300) { return id(arc_color_okay); }
                  else if (x > 300)            { return id(arc_color_bad); }
                  else                         { return id(arc_color_error); }
      - seconds: 35
        then:
          - lvgl.label.update:
              id: co2_value
              text:
                format: "%.0f"
                args: [ id(co2).get_state() ]
                if_nan: "N/A"
          - lvgl.arc.update:
              id: co2_arc
              value: !lambda return id(co2).get_state();
              indicator:
                arc_color: !lambda |-
                  int x = id(co2).state;
                  if      (x <= 1000)            { return id(arc_color_good); }
                  else if (x > 1000 && x < 2000) { return id(arc_color_okay); }
                  else if (x > 2000)             { return id(arc_color_bad); }
                  else                           { return id(arc_color_error); }
      - seconds: 45
        then:
          - lvgl.label.update:
              id: pm25_value
              text:
                format: "%.0f"
                args: [ id(pm_2_5).get_state() ]
                if_nan: "N/A"
          - lvgl.arc.update:
              id: pm25_arc
              value: !lambda return id(pm_2_5).get_state();
              indicator:
                arc_color: !lambda |-
                  int x = id(pm_2_5).state;
                  if      (x <= 5)           { return id(arc_color_good); }
                  else if (x > 5 && x < 35)  { return id(arc_color_okay); }
                  else if (x > 35)           { return id(arc_color_bad); }
                  else                       { return id(arc_color_error); }
      - seconds: 55
        then:
          - lvgl.label.update:
              id: pm10_value
              text:
                format: "%.0f"
                args: [ id(pm_10_0).get_state() ]
                if_nan: "N/A"
          - lvgl.arc.update:
              id: pm10_arc
              value: !lambda return id(pm_10_0).get_state();
              indicator:
                arc_color: !lambda |-
                  int x = id(pm_10_0).state;
                  if      (x <= 5)           { return id(arc_color_good); }
                  else if (x > 5 && x < 35)  { return id(arc_color_okay); }
                  else if (x > 35)           { return id(arc_color_bad); }
                  else                       { return id(arc_color_error); }

i2c:
  sda: GPIO6
  scl: GPIO7
  #scan: True
  low_power_mode: true

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

sensor:
  - platform: sen6x
    type: SEN66
    pm_1_0:
      name: PM 1µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_1_0
    pm_2_5:
      name: PM 2.5µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_2_5
        
    pm_4_0:
      name: PM 4µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_4_0
    pm_10_0:
      name: PM 10µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_10_0
    temperature:
      name: Temperature
      state_class: "measurement"
      id: temperature
    humidity:
      name: Humidity
      state_class: "measurement"
      id: humidity
    voc:
      name: VOC
      state_class: "measurement"
      unit_of_measurement: "VOC Index"
      id: voc
    nox:
      name: NOx
      state_class: "measurement"
      unit_of_measurement: "NOx Index"
      id: nox
    co2:
      name: Carbon Dioxide
      state_class: "measurement"
      unit_of_measurement: "ppm"
      id: co2
    update_interval: 60s

display:
  - platform: mipi_spi
    id: ST7789
    model: ST7789V
    data_rate: 1MHz
    enable_pin: 
      number: GPIO5
      ignore_strapping_warning: true
    cs_pin: 
      number: GPIO4
      ignore_strapping_warning: true
    dc_pin: GPIO3
    reset_pin: GPIO2
    dimensions:
      height: 320
      width: 170
      offset_width: 36
    invert_colors: true
    update_interval: never

lvgl:
  rotation: 180
  displays:
    - ST7789
