esphome:
  name: "master-bedroom-multi-sensor"
  friendly_name: Master Bedroom Multi-Sensor

  project:
    name: "Kerby-Tech.Multi-Sensor"
    version: "1.0.5"

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework: 
    type: esp-idf

globals:
  - id: arc_color_good
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(16,185,129)'
  - id: arc_color_okay
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(221,243,0)'
  - id: arc_color_bad
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(255,0,0)'

logger:

network:
  enable_ipv6: true

switch:
  - platform: restart
    name: "Reboot Sensor"
    icon: mdi:power-cycle

time:
  - platform: sntp
    id: "sntp_time"
    on_time:
      - minutes: /1
        then:
          - lvgl.label.update:
              id: time_value
              text:
                time_format: "%I:%M %p"

i2c:
  sda: GPIO6
  scl: GPIO7
  #scan: True
  low_power_mode: true

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

sensor:
  - platform: sen6x
    type: SEN66
    pm_1_0:
      name: PM 1µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_1_0
    pm_2_5:
      name: PM 2.5µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_2_5
      on_value:
        - lvgl.arc.update:
            id: pm25_arc
            value: !lambda return x;
        - lvgl.label.update:
            id: pm25_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
    pm_4_0:
      name: PM 4µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_4_0
    pm_10_0:
      name: PM 10µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_10_0
      on_value:
        - lvgl.arc.update:
            id: pm10_arc
            value: !lambda return x;
        - lvgl.label.update:
            id: pm10_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
    temperature:
      name: Temperature
      state_class: "measurement"
      id: temperature
      on_value:
        - lvgl.label.update:
            id: temperature_value
            text: 
              format: "%.0f°F"
              args: [ x * (9.0/5.0) + 32.0 ]
              if_nan: "N/A"
        #- script.execute:
            #id: set_arc_gradient
            #min_value: !lambda return lv_arc_get_min_value(id(temperature_arc));
            #max_value: !lambda return lv_arc_get_max_value(id(temperature_arc));
            #current_value: !lambda return x * (9.0/5.0) + 32.0;
        - lvgl.arc.update:
            id: temperature_arc
            value: !lambda return x * (9.0/5.0) + 32.0;
            indicator:
              arc_color: arc_color_okay
        #- lambda: |- #Update Indicator color based on current value
            #lv_obj_set_style_arc_color(id(temperature_arc_indicator), Color(id(arc_color).red, id(arc_color).green, id(arc_color).blue);
    humidity:
      name: Humidity
      state_class: "measurement"
      id: humidity
      on_value:
        - lvgl.arc.update:
            id: humidity_arc
            value: !lambda return x;
        - lvgl.label.update:
            id: humidity_value
            text:
              format: "%.0f%%"
              args: [ x ]
              if_nan: "N/A"
    voc:
      name: VOC
      state_class: "measurement"
      unit_of_measurement: "VOC Index"
      id: voc
      on_value:
        - lvgl.arc.update:
            id: voc_arc
            value: !lambda return x;
        - lvgl.label.update:
            id: voc_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
    nox:
      name: NOx
      state_class: "measurement"
      unit_of_measurement: "NOx Index"
      id: nox
    co2:
      name: Carbon Dioxide
      state_class: "measurement"
      unit_of_measurement: "ppm"
      id: co2
      on_value:
        - lvgl.arc.update:
            id: co2_arc
            value: !lambda return x;
        - lvgl.label.update:
            id: co2_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
    update_interval: 60s

display:
  - platform: mipi_spi
    id: ST7789
    model: ST7789V
    data_rate: 1MHz
    enable_pin: 
      number: GPIO5
      ignore_strapping_warning: true
    cs_pin: 
      number: GPIO4
      ignore_strapping_warning: true
    dc_pin: GPIO3
    reset_pin: GPIO2
    dimensions:
      height: 320
      width: 170
      offset_width: 34
    invert_colors: true
    update_interval: never

script:
  - id: set_arc_gradient
    mode: parallel
    parameters:
      min_value: int
      max_value: int
      current_value: int
    then:
      - lambda: |-
          //Calculate where the current value is as a percentage of the range between mix and max value
          float gradient_percentage = ((current_value - min_value) * 1.0) / ((max_value - min_value) * 1.0);
          Color start_color = Color(6, 73, 51); // Green
          Color end_color = Color(255, 0, 0);   // Red
          Color gradient_color = start_color.gradient(end_color, gradient_percentage);
          id(arc_color) = gradient_color;
          char hex_buffer[8];
          sprintf(hex_buffer, "%02X%02X%02X", id(arc_color).red, id(arc_color).green, id(arc_color).blue);
          std::string hex_str(hex_buffer);
          ESP_LOGI("Post-Calc", "Min: %d, Max: %d, Current: %d, %%: %.2f", min_value, max_value, current_value, gradient_percentage);
          ESP_LOGI("Color", "The current value is: %s", hex_str.c_str());
