esphome:
  name: "master-bedroom-multi-sensor"
  friendly_name: Master Bedroom Multi-Sensor

  project:
    name: "Kerby-Tech.Multi-Sensor"
    version: "1.0.5"

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework: 
    type: esp-idf

globals:
  - id: arc_color_good
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(16,185,129)'
  - id: arc_color_okay
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(221,243,0)'
  - id: arc_color_bad
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(255,0,0)'
  - id: arc_color_cold
    type: esphome::Color
    restore_value: no
    initial_value: 'Color(0,192,255)'

logger:

network:
  enable_ipv6: true

switch:
  - platform: restart
    name: "Reboot Sensor"
    icon: mdi:power-cycle

time:
  - platform: sntp
    id: "sntp_time"
    on_time:
      - minutes: /1
        then:
          - lvgl.label.update:
              id: time_value
              text:
                time_format: "%I:%M %p"

i2c:
  sda: GPIO6
  scl: GPIO7
  #scan: True
  low_power_mode: true

spi:
  clk_pin: GPIO0
  mosi_pin: GPIO1

sensor:
  - platform: sen6x
    type: SEN66
    pm_1_0:
      name: PM 1µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_1_0
    pm_2_5:
      name: PM 2.5µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_2_5
      on_value:
        - lvgl.label.update:
            id: pm25_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
        - lvgl.arc.update:
            id: pm25_arc
            value: !lambda return x;
            indicator:
              arc_color: !lambda |-
                if      (x <= 5)           { return id(arc_color_good); }
                else if (x > 5 && x < 35)  { return id(arc_color_okay); }
                else if (x > 35)           { return id(arc_color_bad); }
    pm_4_0:
      name: PM 4µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_4_0
    pm_10_0:
      name: PM 10µm
      state_class: "measurement"
      unit_of_measurement: "μg/m³"
      id: pm_10_0
      on_value:
        - lvgl.label.update:
            id: pm10_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
        - lvgl.arc.update:
            id: pm10_arc
            value: !lambda return x;
            indicator:
              arc_color: !lambda |-
                if      (x <= 5)           { return id(arc_color_good); }
                else if (x > 5 && x < 35)  { return id(arc_color_okay); }
                else if (x > 35)           { return id(arc_color_bad); }
    temperature:
      name: Temperature
      state_class: "measurement"
      id: temperature
      on_value:
        - lvgl.label.update:
            id: temperature_value
            text: 
              format: "%.0f°F"
              args: [ x * (9.0/5.0) + 32.0 ]
              if_nan: "N/A"
        - lvgl.arc.update:
            id: temperature_arc
            value: !lambda return x * (9.0/5.0) + 32.0;
            indicator:
              arc_color: !lambda |-
                float temperature = x * (9.0/5.0) + 32.0;
                if      (temperature >= 82)                    { return id(arc_color_bad); }
                else if (temperature < 82 && temperature > 68) { return id(arc_color_good); }
                else if (temperature <= 68)                    { return id(arc_color_cold); }
    humidity:
      name: Humidity
      state_class: "measurement"
      id: humidity
      on_value:
        - lvgl.label.update:
            id: humidity_value
            text:
              format: "%.0f%%"
              args: [ x ]
              if_nan: "N/A"
        - lvgl.arc.update:
            id: humidity_arc
            value: !lambda return x;
            indicator:
              arc_color: !lambda |-
                if (x > 50) { return id(arc_color_bad); }
                else        { return id(arc_color_good); }
    voc:
      name: VOC
      state_class: "measurement"
      unit_of_measurement: "VOC Index"
      id: voc
      on_value:
        - lvgl.label.update:
            id: voc_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
        - lvgl.arc.update:
            id: voc_arc
            value: !lambda return x;
            indicator:
              arc_color: !lambda |-
                if      (x <= 100)           { return id(arc_color_good); }
                else if (x > 100 && x < 300) { return id(arc_color_okay); }
                else if (x > 300)            { return id(arc_color_bad); }
    nox:
      name: NOx
      state_class: "measurement"
      unit_of_measurement: "NOx Index"
      id: nox
    co2:
      name: Carbon Dioxide
      state_class: "measurement"
      unit_of_measurement: "ppm"
      id: co2
      on_value:
        - lvgl.label.update:
            id: co2_value
            text:
              format: "%.0f"
              args: [ x ]
              if_nan: "N/A"
        - lvgl.arc.update:
            id: co2_arc
            value: !lambda return x;
            indicator:
              arc_color: !lambda |-
                if      (x <= 1000)            { return id(arc_color_good); }
                else if (x > 1000 && x < 2000) { return id(arc_color_okay); }
                else if (x > 2000)             { return id(arc_color_bad); }
    update_interval: 60s

display:
  - platform: mipi_spi
    id: ST7789
    model: ST7789V
    data_rate: 1MHz
    enable_pin: 
      number: GPIO5
      ignore_strapping_warning: true
    cs_pin: 
      number: GPIO4
      ignore_strapping_warning: true
    dc_pin: GPIO3
    reset_pin: GPIO2
    dimensions:
      height: 320
      width: 170
      offset_width: 34
    invert_colors: true
    update_interval: never
